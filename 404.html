<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OZU Research</title>
<script src="/site.js"></script>
<script>
  // Old or mistyped URLs: /about -> /about/, /@takahashi -> /team/takahashi/, anything else -> top page.
  (function () {
    var here = location.pathname;
    var target = /^\/en(\/|$)/.test(here) ? '/en/' : '/';
    try {
      var p = window.OZU_SITE.legacyPath(here);
      if (p && p !== here) target = p;
    } catch (e) {}
    location.replace(target);
  })();
</script>
</head>
<body style="margin:0;background:#fbfbf9;color:#17181a;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">
<p style="padding:48px 32px;font-size:14px"><a href="/" style="color:#17181a">OZU Research</a></p>
</body>
</html>
